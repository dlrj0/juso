<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>현장조사 동선 정리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- NOTE: 카카오 SDK는 내부적으로 document.write를 호출하는 경우가 있어
     동적으로 삽입하면 일부 브라우저/환경에서 초기화에 실패할 수 있습니다.
     (에러: "Failed to execute 'write' on 'Document': It isn't possible to write into a document from an asynchronously-loaded external script unless it is explicitly opened.")
     이 문제를 회피하기 위해 SDK를 정적으로 로드하도록 아래 script 태그를 추가했습니다.
     필요한 경우 런타임 키 전환 로직(loadKakaoSdkScript 등)은 보존되어 있으므로
     이후에 동적 로드 방식을 재적용할 수 있습니다. -->
<script data-kakao-sdk-static src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3cee8237a39ce9a6fd5e6679220f48ba&libraries=services"></script>
<!-- 카카오맵 JS SDK는 여기서 정적으로 로드하지 않음. 키를 2개(계정 2개, 소진 시 자동 전환)
     쓰기 때문에, 어느 키로 로드할지 런타임에 결정해서 script 태그를 동적으로 삽입함
     (JS 하단 loadKakaoSdkScript() 참고). 두 앱 모두 카카오 디벨로퍼스 "플랫폼 > Web"에
     이 페이지가 배포될 도메인을 등록해둬야 함.
const KAKAO_APP_KEYS = ['YOUR_KAKAO_JS_APP_KEY_1', 'YOUR_KAKAO_JS_APP_KEY_2'];
 -->
<style>
  :root{
    --bg:#F6F6F2;
    --surface:#FFFFFF;
    --surface-2:#EDEBE2;
    --border:#D9D6CB;
    --text:#20241F;
    --text-mute:#686F60;
    --accent:#3C5A40;
    --accent-dark:#2A4030;
    --accent-soft:#E3EAE1;
    --warn:#A8432F;
    --warn-soft:#F5E2DC;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}  
  body{padding-bottom:84px;}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .topbar{
    position:sticky;top:0;z-index:20;background:var(--accent-dark);color:#fff;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .brand{display:flex;flex-direction:column;line-height:1.15;}
  .topbar .brand b{font-size:15px;letter-spacing:0.02em;}
  .topbar .brand span{font-size:11px;color:#C9D6C9;font-family:var(--mono);}  
  .topbar .step{font-size:11px;background:rgba(255,255,255,0.12);padding:4px 9px;border-radius:100px;font-family:var(--mono);} 

  .container{max-width:640px;margin:0 auto;padding:18px 16px 40px;}

  /* ---- upload screen ---- */
  .dropzone{
    border:2px dashed var(--border);border-radius:16px;background:var(--surface);
    padding:40px 20px;text-align:center;transition:border-color .15s,background .15s;
  }
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}  
  .dropzone .icon{font-size:34px;margin-bottom:10px;}
  .dropzone h2{font-size:18px;margin-bottom:6px;}
  .dropzone p{color:var(--text-mute);font-size:13.5px;margin:0 0 18px;line-height:1.5;}
  .filebtn{
    display:inline-block;background:var(--accent);color:#fff;padding:11px 22px;border-radius:10px;
    font-size:14.5px;font-weight:600;border:none;
  }
  .privacy-note{
    margin-top:16px;font-size:12px;color:var(--text-mute);background:var(--surface-2);
    border-radius:10px;padding:10px 12px;line-height:1.5;
  }

  /* ---- mapping screen ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface-2);}  
  .field-row:last-child{border-bottom:none;}
  .field-row .label{font-size:13.5px;font-weight:600;}
  .field-row .sample{font-size:11.5px;color:var(--text-mute);font-family:var(--mono);}  
  select.colselect{
    border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff;
    max-width:150px;
  }
  .primary-btn{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;margin-top:6px;
  }
  .primary-btn:disabled{background:#B8BBAF;}
  .ghost-btn{
    width:100%;background:transparent;color:var(--text-mute);border:1px solid var(--border);border-radius:12px;
    padding:11px;font-size:13.5px;font-weight:600;margin-top:8px;
  }

  /* ---- select screen ---- */
  .summary-bar{display:flex;gap:8px;margin-bottom:14px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .stat b{display:block;font-size:20px;font-family:var(--mono);}  
  .stat span{font-size:11px;color:var(--text-mute);}  
  .searchbar{
    display:flex;gap:8px;margin-bottom:10px;
  }
  .searchbar input{
    flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;
  }
  .sigungu-select{border:1px solid var(--border);border-radius:10px;padding:10px;font-size:13.5px;background:#fff;}  
  .select-actions{display:flex;gap:8px;margin:10px 0 14px;}  
  .select-actions button{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;color:var(--text);
  }
  .village-item{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .village-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;}  
  .village-item .name{font-size:14.5px;font-weight:600;}  
  .village-item .sub{font-size:11.5px;color:var(--text-mute);font-family:var(--mono);}  
  .village-item .count{
    margin-left:auto;font-family:var(--mono);font-size:12.5px;background:var(--surface-2);
    padding:3px 9px;border-radius:100px;flex-shrink:0;
  }
  .sticky-bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
    border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;
  }
  .sticky-bottom .primary-btn{margin:0;}  
  .sticky-bottom .count-pill{
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;
    color:var(--text-mute);white-space:nowrap;padding:0 6px;
  }

  /* ---- route screen ---- */
  .next-card{
    background:var(--accent-dark);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;
  }
  .next-card .eyebrow{font-size:11px;letter-spacing:0.08em;color:#B9CBB8;font-family:var(--mono);text-transform:uppercase;}  
  .next-card .addr{font-size:17px;font-weight:700;margin:6px 0 2px;line-height:1.35;}  
  .next-card .jibun{font-family:var(--mono);font-size:13px;color:#D6E2D5;}  
  .next-card .done-all{font-size:13.5px;color:#D6E2D5;padding:6px 0;}  

  .gps-row{display:flex;gap:8px;margin-bottom:14px;}  
  .gps-btn{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;
    font-size:13px;font-weight:600;text-align:center;
  }
  .gps-btn.active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}  
  .gps-status{font-size:11.5px;color:var(--text-mute);text-align:center;margin:-8px 0 14px;font-family:var(--mono);}  

  .village-group{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}  
  .vg-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;}  
  .vg-head .order-badge{
    width:26px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:700;flex-shrink:0;
  }
  .vg-head .info{flex:1;min-width:0;}  
  .vg-head .info .name{font-size:14.5px;font-weight:700;}  
  .vg-head .info .prog{font-size:11.5px;color:var(--text-mute);font-family:var(--mono);}  
  .vg-head .movebtns{display:flex;gap:4px;}  
  .vg-head .movebtns button, .vg-head .locbtn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--text-mute);
  }
  .vg-head .locbtn.set{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}  
  .vg-head .chevron{font-size:12px;color:var(--text-mute);width:14px;text-align:center;flex-shrink:0;}  

  .parcel-list{border-top:1px solid var(--surface-2);}  
  .parcel-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--surface-2);}  
  .parcel-row:last-child{border-bottom:none;}  
  .parcel-row.done{opacity:0.5;}  
  .parcel-row .pnum{font-family:var(--mono);font-size:11.5px;color:var(--text-mute);width:18px;flex-shrink:0;}  
  .parcel-row .pinfo{flex:1;min-width:0;}  
  .parcel-row .pinfo .addr{font-size:13.5px;line-height:1.4;}  
  .parcel-row .pinfo .jibun{font-family:var(--mono);font-size:11.5px;color:var(--text-mute);}  
  .parcel-row .pinfo .extra{font-size:11px;color:var(--text-mute);margin-top:2px;}  
  .parcel-row .pmove{display:flex;gap:3px;flex-shrink:0;}  
  .parcel-row .pmove button{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:12px;color:var(--text-mute);
  }
  .parcel-row .pcheck{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0;}  

  .empty-note{text-align:center;padding:50px 20px;color:var(--text-mute);font-size:13.5px;line-height:1.6;}  
  .backlink{display:inline-block;margin-bottom:14px;font-size:12.5px;color:var(--text-mute);cursor:pointer;}  
  .hidden{display:none !important;}  
  .warn-badge{background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:100px;margin-left:6px;}  

  /* ---- gear / modals ---- */
  .gearbtn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:8px;width:30px;height:30px;font-size:14px;flex-shrink:0;}  
  .topbar-right{display:flex;align-items:center;gap:8px;}  
  .modal{position:fixed;inset:0;background:rgba(20,24,19,0.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}  
  .modal-card{background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 28px;width:100%;max-width:640px;max-height:82vh;overflow-y:auto;}  
  .modal-card h3{margin-bottom:4px;font-size:16px;}  
  .modal-card label.fieldlabel{display:block;font-size:12.5px;font-weight:600;margin:14px 0 4px;}  
  .modal-card input[type=text]{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;}  
  .modal-card .row-btns{display:flex;gap:8px;margin:8px 0 4px;}  
  .modal-card .row-btns button{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600;color:var(--text);}  
  .hint{font-size:12px;color:var(--text-mute);line-height:1.55;margin:6px 0;}  
  .hint b{color:var(--text);}  
  .exportcol-row{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--surface-2);}  
  .exportcol-row input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}  
  .geo-status{font-size:11.5px;color:var(--text-mute);text-align:center;margin:-6px 0 14px;font-family:var(--mono);line-height:1.5;}  

  /* ---- manual parcel add (upload screen) ---- */
  #manualAddCard{margin-top:14px;}  
  #manualAddCard label.fieldlabel{display:block;font-size:12.5px;font-weight:600;margin:12px 0 4px;}  
  #manualAddCard label.fieldlabel:first-of-type{margin-top:4px;}  
  #manualAddCard input[type=text]{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;}  
  #manualAddCard .two-col{display:flex;gap:8px;}  
  #manualAddCard .two-col > div{flex:1;min-width:0;}  
  #manualAddCard .manual-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;}  
  #manualAddCard .manual-chip{
    display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent-dark);
    border-radius:100px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;
  }
  #manualAddCard .manual-chip button{
    background:none;border:none;color:var(--accent-dark);opacity:0.6;font-size:15px;line-height:1;
    padding:2px 5px;cursor:pointer;
  }
  #manualAddCard .manual-addcol{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
  }
  #manualAddCard .manual-parcel-list{margin-top:12px;border-top:1px solid var(--surface-2);}  
  #manualAddCard .manual-parcel-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--surface-2);
  }
  #manualAddCard .mp-info{min-width:0;}  
  #manualAddCard .mp-addr{font-size:13px;line-height:1.4;}  
  #manualAddCard .mp-jibun{font-family:var(--mono);font-size:11px;color:var(--text-mute);}  
  #manualAddCard .mp-extra{font-size:11px;color:var(--text-mute);margin-top:1px;}  
  #manualAddCard .manual-parcel-row button{
    flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;font-size:12px;color:var(--warn);
  }
  #manualAddCard .manual-count{font-size:12.5px;color:var(--text-mute);margin-top:10px;}  
  #manualAddCard .manual-count b{color:var(--text);}  
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>현장조사 동선 정리</b><span id="topbarSub">FIELD ROUTE</span></div>
  <div class="topbar-right">
    <span id="quotaBadge" style="font-size:11px;background:rgba(255,255,255,0.12);padding:4px 9px;border-radius:100px;font-family:var(--mono);"></span>
    <button class="gearbtn" onclick="App.openSettings()" title="설정">⚙</button>
    <div class="step" id="stepBadge">업로드</div>
  </div>
</div>

<div class="container">

  <!-- SCREEN 1: UPLOAD -->
  <div id="screen-upload">
    <div class="dropzone" id="dropzone">
      <div class="icon">📄</div>
      <h2>주소 엑셀 업로드</h2>
      <p>소재지(주소) 컬럼이 있는 엑셀이라면 무엇이든 올려보세요.<br>주소를 마을 단위로 자동 정리하고 방문 순서까지 계산해드려요.</p>
      <label class="filebtn">파일 선택<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;"></label>
    </div>
    <div class="card" id="manualAddCard">
      <h3 style="font-size:15px;margin-bottom:4px;">필지 직접 추가</h3>
      <p class="hint" style="margin-top:0;">몇 개 필지만 조사할 때는 엑셀 없이 여기서 바로 추가해서 시작할 수 있어요.</p>

      <div id="manualParcelForm"></div>
      <button class="ghost-btn" style="margin-top:10px;" onclick="App.addManualParcel()">+ 이 필지 추가</button>

      <div id="manualParcelListWrap"></div>

      <button class="primary-btn hidden" id="manualStartBtn" onclick="App.startFromManual()">추가한 필지로 시작하기</button>
    </div>
  </div>

  <!-- SCREEN 1.5: SHEET PICKER (multi-sheet files only) -->
  <div id="screen-sheetpick" class="hidden">
    <span class="backlink" onclick="App.goScreen('upload')">← 다른 파일 올리기</span>
    <div id="sheetPickerBox"></div>
  </div>

  <!-- SCREEN 2: MAPPING -->
  <div id="screen-mapping" class="hidden">
    <span class="backlink" onclick="App.goScreen('upload')">← 다른 파일 올리기</span>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">컬럼 확인</h3>
      <p style="font-size:12.5px;color:var(--text-mute);margin:0 0 4px;">자동으로 찾았어요. 다르면 직접 골라주세요. (법정동코드가 있으면, 좌표 없이도 마을 순서를 �[...]
